<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Futuro Dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>Meu Perfil de Desenvolvedor</h1>
        </div>
    </header>

    <section class="sobre">
        <div class="container">
            <h2>Sobre Mim</h2>
            <img src="https://via.placeholder.com/150" alt="Foto de Perfil" class="perfil-img">
            <p>Olá! Estou em transição de carreira estudando para ser um Programador Full Stack (Java & React). Focado em aprender e resolver problemas.</p>
        </div>
    </section>

    <section class="contato">
        <div class="container">
            <h2>Fale Comigo</h2>
            <p>Entre em contato para oportunidades ou networking.</p>
            
            <form>
                <input type="text" placeholder="Seu Nome" required>
                <input type="email" placeholder="Seu E-mail" required>
                <textarea placeholder="Sua Mensagem" rows="4"></textarea>
                <button type="submit">Enviar Mensagem</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 - Desenvolvido durante o curso da EBAC</p>
        </div>
    </footer>

</body>
</html>
